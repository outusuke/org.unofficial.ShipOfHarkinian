name: CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '*.*.*'

jobs:
  build:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ShipOfHarkinian.flatpak
          manifest-path: org.unofficial.ShipOfHarkinian.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: ShipOfHarkinian.flatpak

  release:
    name: "Publish Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ShipOfHarkinian.flatpak
          generate_release_notes: true
          body: |
            Unofficial Flatpak of Ship of Harkinian 9.2.3 (Ackbar Delta).
            You need your own Ocarina of Time ROM.

            Install:
              flatpak install --user ShipOfHarkinian.flatpak
              flatpak run org.unofficial.ShipOfHarkinian
