app-id: org.unofficial.ShipOfHarkinian
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: soh-launch

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-download:ro
  - --env=APPIMAGE_EXTRACT_AND_RUN=1

modules:
  - name: soh
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/soh
      - |
        cd src
        echo "=== zip contents ==="
        ls -laR .
        APPIMAGE=""
        for f in ./* ./*/*; do
          [ -f "$f" ] || continue
          if dd if="$f" bs=1 skip=8 count=2 2>/dev/null | grep -aq '^AI'; then
            APPIMAGE="$f"
            break
          fi
        done
        if [ -n "$APPIMAGE" ]; then
          echo "=== found AppImage: $APPIMAGE ==="
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          cp -a squashfs-root/. /app/lib/soh/
        else
          echo "=== no AppImage found, copying zip contents as-is ==="
          cp -a . /app/lib/soh/
        fi
      - find /app/lib/soh -maxdepth 4 -type f \( -name AppRun -o -name soh.elf \) -exec chmod +x {} +
      - install -Dm755 soh-launch /app/bin/soh-launch
      - install -Dm644 org.unofficial.ShipOfHarkinian.desktop -t /app/share/applications
    sources:
      - type: archive
        url: https://github.com/HarbourMasters/Shipwright/releases/download/9.2.3/SoH-Ackbar-Delta-Linux.zip
        sha256: f81cde8052142d6abbbaaffa70699d6748e4cde3f158be8f268c3aab338ee315
        strip-components: 0
        dest: src
      - type: script
        dest-filename: soh-launch
        commands:
          - export APPIMAGE_EXTRACT_AND_RUN=1
          - unset APPIMAGE APPDIR OWD ARGV0
          - DATA="${XDG_DATA_HOME:-$HOME/.local/share}"
          - D="$DATA/soh-bin"
          - mkdir -p "$D" "$DATA/soh"
          - cp -a /app/lib/soh/. "$D/"
          - chmod -R u+w "$D"
          - OTR=$(find "$D" -name soh.otr | head -n 1)
          - B=$(dirname "${OTR:-$D/x}")
          - export SHIP_BIN_DIR="$B"
          - export SHIP_HOME="$DATA/soh"
          - cd "$B"
          - EXE=$(find "$D" -type f -name soh.elf | head -n 1)
          - if [ -n "$EXE" ]; then exec "$EXE" "$@"; fi
          - exec "$D/AppRun" "$@"
      - type: file
        path: org.unofficial.ShipOfHarkinian.desktop
