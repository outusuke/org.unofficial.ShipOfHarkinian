app-id: org.unofficial.ShipOfHarkinian
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: soh-launch

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-download:ro
  - --env=APPIMAGE_EXTRACT_AND_RUN=1

modules:
  - name: soh
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/soh
      - |
        cd src
        chmod +x soh.appimage
        ./soh.appimage --appimage-extract
        cp -a squashfs-root/. /app/lib/soh/
      - find /app/lib/soh -maxdepth 4 -type f \( -name AppRun -o -name soh.elf \) -exec chmod +x {} +
      - install -Dm755 soh-launch /app/bin/soh-launch
      - install -Dm644 org.unofficial.ShipOfHarkinian.desktop -t /app/share/applications
    sources:
      - type: file
        url: https://github.com/HarbourMasters/Shipwright/releases/download/9.3.0/SoH-Dewey-Alpha.appimage
        sha256: 8507bb70413e130e452ebaf5f156bfd78013ee0144364b7968680e8cf064a0fa
        dest-filename: soh.appimage
        dest: src
      - type: script
        dest-filename: soh-launch
        commands:
          - export APPIMAGE_EXTRACT_AND_RUN=1
          - unset APPIMAGE APPDIR OWD ARGV0
          - DATA="${XDG_DATA_HOME:-$HOME/.local/share}"
          - D="$DATA/soh-bin"
          - mkdir -p "$D" "$DATA/soh"
          - cp -a /app/lib/soh/. "$D/"
          - chmod -R u+w "$D"
          - O2R=$(find "$D" \( -name soh.o2r -o -name soh.otr \) | head -n 1)
          - B=$(dirname "${O2R:-$D/x}")
          - export SHIP_BIN_DIR="$B"
          - export SHIP_HOME="$DATA/soh"
          - cd "$B"
          - EXE=$(find "$D" -type f -name soh.elf | head -n 1)
          - if [ -n "$EXE" ]; then exec "$EXE" "$@"; fi
          - exec "$D/AppRun" "$@"
      - type: file
        path: org.unofficial.ShipOfHarkinian.desktop
